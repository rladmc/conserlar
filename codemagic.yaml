workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Limpar cache e atualizar dependências
        script: |
          flutter clean
          flutter pub get
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
