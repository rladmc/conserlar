workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Force iOS 16.0 Deployment Target
        script: |
          echo "Forçando versão mínima do iOS para 16.0..."
          
          # Atualiza diretamente o Podfile e o project.pbxproj usando Python
          python3 -c "
          import os, re

          # 1. Atualiza o Podfile
          podfile_path = 'ios/Podfile'
          if os.path.exists(podfile_path):
              with open(podfile_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'platform\s+:ios,\s*[\x27\x27\"\']\d+[\.\d]*[\x27\x27\"\']', 'platform :ios, \x2716.0\x27', content)
              with open(podfile_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 2. Varre o pbxproj para garantir o IPHONEOS_DEPLOYMENT_TARGET como 16.0
          pbxproj_path = 'ios/Runner.xcodeproj/project.pbxproj'
          if os.path.exists(pbxproj_path):
              with open(pbxproj_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET\s*=\s*\d+\.\d+;', 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;', content)
              with open(pbxproj_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          "
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
