workflows:
  ios-release-workflow:
    name: Conserlar iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials # Nome opcional para o grupo se usares variáveis, mas a integração via UI já trata disso
      vars:
        BUNDLE_ID: "com.rladmc.appconserlar"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rladmc.appconserlar
    scripts:
      - name: Instalar dependências do Flutter
        script: |
          flutter pub get
      - name: Compilar IPA para App Store
        script: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_beta_builds_before_processing: false