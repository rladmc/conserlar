workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix iOS Minimum Deployment Target to 16.0
        script: |
          cd ios
          # Atualiza o Podfile para forçar o iOS 16.0
          if ! grep -q "platform :ios, '16.0'" Podfile; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" Podfile
          fi
          
          # Garante que os blocos de pós-instalação configurem o target 16.0 nos Pods
          cat << 'EOF' >> Podfile

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end
          end
          EOF
          cd ..
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install && cd ..
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk