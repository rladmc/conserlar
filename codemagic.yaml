workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Force iOS 16.0 Globally in iOS Project
        script: |
          echo "Varrendo e forçando iOS 16.0 em todos os arquivos de configuração do iOS..."
          
          # Executa um script Python para atualizar QUALQUER arquivo de projeto ou configuração que contenha deployment target antigo
          python3 -c "
          import os, re

          ios_dir = 'ios'
          for root, dirs, files in os.walk(ios_dir):
              for file in files:
                  if file.endswith(('pbxproj', 'plist', 'xcconfig', 'Podfile')):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          # Substitui qualquer menção a IPHONEOS_DEPLOYMENT_TARGET ou deployment target para 16.0
                          new_content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET\s*=\s*\d+\.\d+', 'IPHONEOS_DEPLOYMENT_TARGET = 16.0', content)
                          new_content = re.sub(r'<key>MinimumOSVersion</key>\s*<string>\d+\.\d+</string>', '<key>MinimumOSVersion</key><string>16.0</string>', new_content)
                          new_content = re.sub(r'platform\s+:ios,\s*[\x27\x27\"\']\d+\.\d+[\x27\x27\"\']', 'platform :ios, \x2716.0\x27', new_content)
                          
                          if new_content != content:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              print(f'Atualizado: {filepath}')
                      except Exception as e:
                          print(f'Erro ao processar {filepath}: {e}')
          "
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
