workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Forçar iOS 16 em todos os arquivos de configuração
        script: |
          # Varre todos os arquivos de projeto, xcsettings e pbxproj para matar qualquer menção ao iOS 15
          find ios -name "*.pbxproj" -o -name "*.xcconfig" | xargs sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g'
          find ios -name "*.pbxproj" -o -name "*.xcconfig" | xargs sed -i '' 's/TVOS_DEPLOYMENT_TARGET = [0-9.]*;/TVOS_DEPLOYMENT_TARGET = 16.0;/g'
          # Garante o Info.plist principal também
          plutil -replace MinimumOSVersion -string "16.0" ios/Runner/Info.plist || true
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
