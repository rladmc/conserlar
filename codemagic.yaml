workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix iOS Minimum Deployment Target to 16.0
        script: |
          cd ios
          
          # 1. Altera o platform :ios para 16.0 no topo do Podfile
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '16.0'\n/" Podfile
          fi

          # 2. Injeta a regra do IPHONEOS_DEPLOYMENT_TARGET de forma segura dentro do post_install existente
          python3 -c "
          with open('Podfile', 'r') as f:
              content = f.read()

          target_code = '''    target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
          end'''

          if 'IPHONEOS_DEPLOYMENT_TARGET' not in content:
              # Procura o final do post_install e injeta antes do último end
              pos = content.rfind('end')
              if pos != -1:
                  content = content[:pos] + '    target.build_configurations.each do |config|\n      config.build_settings[\x27IPHONEOS_DEPLOYMENT_TARGET\x27] = \x2716.0\x27\n    end\n' + content[pos:]
              with open('Podfile', 'w') as f:
                  f.write(content)
          "
          cd ..
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install && cd ..
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk