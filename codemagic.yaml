workflows:
  conserlar-ios-ipa:
    name: Conserlar iOS IPA (AltStore)
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obter dependências do Flutter
        script: |
          flutter pub get
      - name: Construir IPA para iOS
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa