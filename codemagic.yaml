workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Force iOS 16.0 Deployment Target in Xcode Project
        script: |
          # Garante que o projeto gera a estrutura do iOS antes do patch
          flutter precache --ios
          
          # Atualiza o deployment target para 16.0 diretamente no arquivo de projeto do Xcode (pbxproj)
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "Atualizando IPHONEOS_DEPLOYMENT_TARGET para 16.0 no pbxproj..."
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' "$PBXPROJ"
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' "$PBXPROJ"
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' "$PBXPROJ"
          fi

          # Também ajusta o Podfile para garantir compatibilidade
          cd ios
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '16.0'\n/" Podfile
          fi
          cd ..
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
