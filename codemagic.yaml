workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix iOS Minimum Deployment Target to 16.0
        script: |
          cd ios
          
          # Garante que o target do platform no topo seja 16.0
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '16.0'\n/" Podfile
          fi

          # Adiciona o ajuste de deployment target de forma segura no post_install se já não existir
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET" Podfile; then
            python3 -c "
            with open('Podfile', 'r') as f:
                content = f.read()
            
            # Procura o bloco post_install e injeta a linha de configuração do target 16.0
            if 'post_install do |installer|' in content:
                target_line = '\n    installer.pods_project.targets.each do |target|\n      target.build_configurations.each do |config|\n        config.build_settings[\x27IPHONEOS_DEPLOYMENT_TARGET\x27] = \x2716.0\x27\n      end\n    end'
                content = content.replace('post_install do |installer|', 'post_install do |installer|' + target_line)
                with open('Podfile', 'w') as f:
                    f.write(content)
            "
          fi
          cd ..
      - name: Build iOS App (No Codesign for test)
        script: |
          # O próprio flutter build executa o pod install no momento certo com todas as dependências geradas
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
