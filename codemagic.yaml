workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Force iOS 16.0 Deployment Target in Xcode Project
        script: |
          echo "Forçando iOS 16.0 no projeto Xcode e Podfile..."
          
          # 1. Altera todas as ocorrências de deployment target no pbxproj para 16.0
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            # Substitui qualquer versão antiga (11.0 até 15.6) por 16.0
            python3 -c "
            with open('$PBXPROJ', 'r') as f:
                content = f.read()
            import re
            # Substitui IPHONEOS_DEPLOYMENT_TARGET por 16.0
            content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = \d+\.\d+;', 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;', content)
            with open('$PBXPROJ', 'w') as f:
                f.write(content)
            "
          fi

          # 2. Garante o platform :ios, '16.0' no Podfile
          cd ios
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '16.0'\n/" Podfile
          fi
          cd ..
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
