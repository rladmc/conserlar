- name: DEBUG iOS deployment target
  script: |
    echo "======================================"
    echo "PROJECT PBXPROJ"
    echo "======================================"

    if [ -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
      grep -n "IPHONEOS_DEPLOYMENT_TARGET" \
        ios/Runner.xcodeproj/project.pbxproj || true
    else
      echo "project.pbxproj não encontrado"
    fi

    echo ""
    echo "======================================"
    echo "FLUTTER XCCONFIG"
    echo "======================================"

    for file in ios/Flutter/*.xcconfig; do
      if [ -f "$file" ]; then
        echo "---- $file ----"
        grep -n "IPHONEOS_DEPLOYMENT_TARGET" "$file" || true
      fi
    done

    echo ""
    echo "======================================"
    echo "ALL IOS CONFIGS"
    echo "======================================"

    grep -R -n "IPHONEOS_DEPLOYMENT_TARGET" ios \
      --include="*.pbxproj" \
      --include="*.xcconfig" \
      2>/dev/null || true

    echo ""
    echo "======================================"
    echo "XCODE VERSION"
    echo "======================================"

    xcodebuild -version
