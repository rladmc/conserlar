workflows:
  conserlar-workflow:
    name: Conserlar Build Pipeline
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Forçar iOS 16 no project.pbxproj
        script: |
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' {} +
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' {} +
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' {} +
      - name: Build iOS App (No Codesign for test)
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android App (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/app/outputs/flutter-apk/*.apk
