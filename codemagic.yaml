- name: DEBUG iOS deployment target
  script: |
    echo "======================================"
    echo "PROJECT PBXPROJ"
    echo "======================================"

    grep -n "IPHONEOS_DEPLOYMENT_TARGET" \
      ios/Runner.xcodeproj/project.pbxproj || true

    echo ""
    echo "======================================"
    echo "XCCONFIG"
    echo "======================================"

    grep -R "IPHONEOS_DEPLOYMENT_TARGET" ios/Flutter \
      --include="*.xcconfig" || true

    echo ""
    echo "======================================"
    echo "XCODE BUILD SETTINGS - RUNNER"
    echo "======================================"

    xcodebuild \
      -project ios/Runner.xcodeproj \
      -target Runner \
      -configuration Release \
      -showBuildSettings \
      | grep -E "IPHONEOS_DEPLOYMENT_TARGET|SDKROOT|PRODUCT_NAME" \
      || true
