workflows:
  conserlar-android:
    name: Conserlar App - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Instalar dependências
        script: |
          flutter pub get
      - name: Construir APK de Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk